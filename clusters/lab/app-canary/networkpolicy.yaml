apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canary-demo
  namespace: app-canary
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - podSelector: {}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: app-canary
spec:
  mtls:
    mode: PERMISSIVE
