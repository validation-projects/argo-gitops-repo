apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: canary-demo
  namespace: app-canary
spec:
  # Split por host: o Argo Rollouts fixa o selector de cada Service no ReplicaSet correspondente.
  host: '*.app-canary.svc.cluster.local'
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
