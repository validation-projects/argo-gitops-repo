apiVersion: v1
kind: ResourceQuota
metadata:
  name: canary-demo
  namespace: app-canary
spec:
  hard:
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '4'
    limits.memory: 4Gi
    pods: '30'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: canary-demo
  namespace: app-canary
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 128Mi
