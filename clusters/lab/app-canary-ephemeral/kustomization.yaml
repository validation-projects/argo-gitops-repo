apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deployed by the canary-demo-ephemeral Application, created and deleted by
# validation-app's ephemeral workflow; the image digest is set on the Application.
namespace: app-canary
resources:
- deployment.yaml
- service.yaml
images:
- name: canary-demo
  newName: ghcr.io/validation-projects/canary-demo
