apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-demo
  namespace: argocd
spec:
  project: canary-demo
  source:
    repoURL: git@github.com:validation-projects/argo-gitops-repo.git
    targetRevision: main
    path: clusters/lab/app-canary
  destination:
    server: https://kubernetes.default.svc
    namespace: app-canary
  # Sem syncPolicy.automated: habilitar somente após validar o fluxo manual.
  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      jsonPointers:
        - /spec/http/0/route
