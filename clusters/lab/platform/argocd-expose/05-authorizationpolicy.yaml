apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-argocd-host-only
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: [argo.diegovieira.app, app.canary.lab, canary.diegovieira.app]
