# Pré-requisito: cert-manager instalado (kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/<versão>/cert-manager.yaml)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: diegohvcarlos@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # Pré-requisito: Secret com o token da API da DigitalOcean (fora do Git):
      # kubectl -n cert-manager create secret generic digitalocean-dns --from-literal=access-token=<TOKEN>
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
