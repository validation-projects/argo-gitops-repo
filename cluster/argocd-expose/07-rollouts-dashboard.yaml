# Argo Rollouts dashboard at https://argo.diegovieira.app/rollouts/, behind oauth2-proxy (GitHub login).
# Requires the Secret rollouts-oauth2-proxy (client-id, client-secret, cookie-secret) in argo-rollouts; see README.
apiVersion: v1
kind: Namespace
metadata:
  name: argo-rollouts
---
# Dashboard: dashboard-install.yaml from argo-rollouts v1.10.2, with namespace, hardening and resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/component: argo-rollouts-dashboard
    app.kubernetes.io/name: argo-rollouts-dashboard
    app.kubernetes.io/part-of: argo-rollouts
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-rollouts-dashboard
  labels:
    app.kubernetes.io/component: argo-rollouts-dashboard
    app.kubernetes.io/name: argo-rollouts-dashboard
    app.kubernetes.io/part-of: argo-rollouts
rules:
  - apiGroups: [argoproj.io]
    resources: [rollouts, rollouts/status, rollouts/finalizers]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [argoproj.io]
    resources: [analysisruns, analysisruns/finalizers, experiments, experiments/finalizers]
    verbs: [create, get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [analysistemplates, clusteranalysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, update, list, watch, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-rollouts-dashboard
  labels:
    app.kubernetes.io/component: argo-rollouts-dashboard
    app.kubernetes.io/name: argo-rollouts-dashboard
    app.kubernetes.io/part-of: argo-rollouts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argo-rollouts-dashboard
subjects:
  - kind: ServiceAccount
    name: argo-rollouts-dashboard
    namespace: argo-rollouts
---
apiVersion: v1
kind: Service
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/component: argo-rollouts-dashboard
    app.kubernetes.io/name: argo-rollouts-dashboard
    app.kubernetes.io/part-of: argo-rollouts
spec:
  selector:
    app.kubernetes.io/name: argo-rollouts-dashboard
  ports:
    - { name: http, port: 3100, targetPort: 3100, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-rollouts-dashboard
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/component: argo-rollouts-dashboard
    app.kubernetes.io/name: argo-rollouts-dashboard
    app.kubernetes.io/part-of: argo-rollouts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-rollouts-dashboard
    spec:
      serviceAccountName: argo-rollouts-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: argo-rollouts-dashboard
          image: quay.io/argoproj/kubectl-argo-rollouts:v1.10.2
          args: [dashboard, --address=0.0.0.0, --root-path=rollouts]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /rollouts/, port: http }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollouts-oauth2-proxy
  namespace: argo-rollouts
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-oauth2-proxy
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: rollouts-oauth2-proxy
spec:
  selector:
    app.kubernetes.io/name: rollouts-oauth2-proxy
  ports:
    - { name: http, port: 4180, targetPort: 4180, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollouts-oauth2-proxy
  namespace: argo-rollouts
  labels:
    app.kubernetes.io/name: rollouts-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rollouts-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollouts-oauth2-proxy
    spec:
      serviceAccountName: rollouts-oauth2-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --http-address=0.0.0.0:4180
            - --provider=github
            # Only these GitHub users can sign in (comma-separated). --github-org/--github-team also work.
            - --github-user=diegohvieira
            - --email-domain=*
            - --upstream=http://argo-rollouts-dashboard.argo-rollouts.svc.cluster.local:3100/rollouts/
            - --proxy-prefix=/rollouts/oauth2
            - --redirect-url=https://argo.diegovieira.app/rollouts/oauth2/callback
            - --cookie-name=_rollouts_oauth2
            - --cookie-path=/rollouts
            - --cookie-secure=true
            - --cookie-expire=12h
            - --reverse-proxy=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: rollouts-oauth2-proxy, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: rollouts-oauth2-proxy, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: rollouts-oauth2-proxy, key: cookie-secret } }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# The dashboard has no auth: only oauth2-proxy reaches it, and only the ingress gateway reaches oauth2-proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argo-rollouts-dashboard-ingress
  namespace: argo-rollouts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argo-rollouts-dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rollouts-oauth2-proxy
      ports:
        - { protocol: TCP, port: 3100 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rollouts-oauth2-proxy-ingress
  namespace: argo-rollouts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rollouts-oauth2-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - { protocol: TCP, port: 4180 }
